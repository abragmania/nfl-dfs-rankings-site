<!doctype html>
<html lang="en" class="is-site">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NFLDFSRankings</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="site/site.css">
  <link rel="stylesheet" href="player-card.css" />
  <!-- The approved classic look: the app's own copy of NBA's stylesheets at commit a39b37e, scoped under .nl (never a live link), and NFL's additions. -->
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="look/board.css" />
  <link rel="stylesheet" href="look/lineups.css" />
  <link rel="stylesheet" href="look/theme-light.css" />
  <link rel="stylesheet" href="look/look.css" />
  <script>
    // Dark mode is the default (2026-09-27 brief): set <html data-theme> before first paint so the
    // page never flashes light-then-dark. A saved choice in localStorage ("nfldfs-theme": "light" or
    // "dark") always wins; anything else (nothing saved, or a bad value) falls back to dark. Wrapped
    // in try/catch since localStorage can throw (private browsing, disabled storage). The header's
    // toggle button (public/js/header.js's wireThemeToggle, wired from app.js) reads/writes the same
    // key and flips this same attribute at runtime. "?theme=light" or "?theme=dark" (dev/QA
    // convenience only, same category as this page's existing "?tab="/"&scrollTo="
    // params below) overrides for this page load without touching the saved choice, so a screenshot
    // script can force either theme without clicking the toggle or writing localStorage.
    (function () {
      var theme = "dark";
      try {
        var saved = window.localStorage.getItem("nfldfs-theme");
        if (saved === "light" || saved === "dark") theme = saved;
      } catch (e) {
        /* localStorage unavailable — default to dark for this page load */
      }
      var forced = new URLSearchParams(window.location.search).get("theme");
      if (forced === "light" || forced === "dark") theme = forced;
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
</head>
<body>
  <!-- The one top bar (the approved look, PROJECT.md Part 4 item 5; the Showdown screen shares it since 2026-11-13): brand, slate stamps, the tabs, then the Main slate / Showdown switch (#mode-row, in #top-slates: the main slate's
       tile, any second slate's and one tile per loaded showdown, with Upload Showdown CSV), the TwoGun switch, the buttons and Dark | Light. Each piece marks which screen it belongs to (data-only: look.css hides it on the other
       one; app-showdown.js applyMode sets body[data-view]). -->
  <header class="nl" id="classic-header">
    <div class="top">
      <div class="brand"><span class="mk"></span>NFL DFS<small class="mode-tag" data-only="classic">DraftKings classic</small></div>
      <div id="slate-line" class="stamps slate-line" data-only="classic">Loading...</div>
      <div id="sd-slate-line" class="stamps slate-line" data-only="showdown"></div>
      <div class="vtabs"><nav id="tabs" data-only="classic"></nav><nav id="sd-tabs" data-only="showdown"></nav><button id="sources-btn" class="tab-btn" type="button" data-only="classic" title="Which sources feed the projections and ownership, their weights, and when each was last pulled">Sources</button><button id="sd-sources-btn" class="tab-btn" type="button" data-only="showdown" title="Which sources feed the projections and ownership, their weights, and when each was last pulled">Sources</button><button id="injuries-btn" class="tab-btn" type="button" data-only="classic" title="Who the injury sources tag or hide, and your In / Out for each">Injuries</button><button id="sd-injuries-btn" class="tab-btn" type="button" data-only="showdown" title="Who the injury sources tag or hide, and your In / Out for each">Injuries</button></div>
      <span class="grow"></span>
      <div id="top-slates"><div id="mode-row" class="mode-row"></div></div>
      <div id="tg-mode" class="tg-mode" data-only="classic" hidden></div>
      <div class="header-actions">
        <label class="chip upload-btn" data-only="classic">
          Upload DraftKings CSV
          <input id="csv-input" type="file" accept=".csv,text/csv" hidden />
        </label>
        <span id="upload-info" class="upload-info" data-only="classic"></span>
        <button id="sd-salary-btn" class="chip" type="button" data-only="showdown" title="How much of the $50,000 cap contest lineups spent">Salary used</button>
        <button id="tracked-btn" class="chip" type="button" data-only="classic" title="The DFS players you track: contest entrants, the RotoGrinders top 100 and your marks">Tracked</button>
        <button id="sd-tracked-btn" class="chip" type="button" data-only="showdown" title="The DFS players you track: contest entrants, the RotoGrinders top 100 and your marks">Tracked</button>
        <button id="refresh-btn" class="chip" type="button" data-only="classic">Refresh</button>
        <button id="sd-refresh-btn" class="chip" type="button" data-only="showdown">Refresh</button>
        <span class="pull-group" data-only="classic"><button id="pull-now-btn" class="chip" type="button" title="Runs the TwoGun pulls, a refresh, the save and the site publish">Pull now</button>
        <span id="pull-info" class="upload-info"></span></span>
      </div>
      <div class="themes" id="theme-switch" role="group" aria-label="Theme"><button type="button" data-theme-set="dark">Dark</button><button type="button" data-theme-set="light">Light</button></div>
    </div>
    <!-- The row under the bar: the source pills and, beside them, the TwoGun status pill (header.js renderModeBox puts it in #tg-pill). Hidden when empty. -->
    <div class="header-sub" data-only="classic">
      <div id="pills-row" class="pills-row"></div>
      <div id="tg-pill" class="tg-pill" hidden></div>
    </div>
    <!-- A Showdown's source pills and the pill naming the sources its board reads (showdown/view.js, figures-label.js): source state, which the Sources page's Data as of shows (item 7, G64); not drawn in the bar. -->
    <div id="sd-source-state" hidden>
      <div id="sd-pills-row" class="pills-row"></div>
      <div id="sd-figures-pill" class="tg-pill" hidden></div>
    </div>
  </header>

  <main class="main" id="classic-main">
    <div id="status" class="status"></div>
    <!-- Second slates (D57): one plain line while a second slate (the afternoon-only slate, say) is on screen;
         hidden on the main slate. Filled by app.js's renderSlateChrome. -->
    <p id="slate-note" class="tab-note" hidden></p>

    <!-- The Optimizer and Lineups tabs in the approved look (.nl: public/look/). The game strip and the two lines under it are static markup drawn by app.js; #lineup-mount is the part lineup.js's renderLineupPanel redraws.
         #pool-top (the sticky filter bar and the `Build finished.` notice) sits outside the redraw and is moved into the pool column after each one, so typing in its boxes keeps its caret. -->
    <div id="lineup-panel" class="panel nl">
      <section id="gamestrip"></section>
      <div class="updline" id="updline"><p id="own-banner" class="own-banner stale-line"></p></div>
      <div id="pool-top" class="fbar"><section id="filterbar"></section><div id="build-notice" class="build-notice" hidden></div></div>
      <div id="lineup-mount" class="lineup-mount"></div>
    </div>

    <!-- Sources view (Adam 2026-10-18): ONE page (public/js/sources-page.js) shown while the header's Sources link is on, with the
         Projections or Projected Ownership player table under its Players heading (the two panels below). -->
    <div id="sources-panel" class="panel sources-panel" hidden></div>
    <div id="projections-panel" class="panel" hidden></div>
    <div id="ownership-panel" class="panel" hidden></div>
    <div id="showdown-panel" class="panel nl" hidden></div>
    <div id="entries-panel" class="panel" hidden></div>
    <!-- The Injuries tab (injuries-tab.js): who the injury sources tag or hide on the slate on screen, and Adam's In / Out for each. -->
    <div id="injuries-panel" class="panel" hidden></div>
    <div id="empty-state" class="empty-state" hidden></div>
  </main>

  <!-- Showdown main (D39/D40): parallel structure to the classic <main> above, hidden until a showdown
       tile in the mode row is clicked (location.hash becomes "#sd=<key>"). Rendered entirely by
       public/js/showdown/view.js, table.js, tabs.js and lineup.js. -->
  <main class="main" id="showdown-main" hidden>
    <div id="sd-status" class="status"></div>

    <!-- The Optimizer tab, the Showdown's main screen (Adam 2026-10-26: the Rankings tab folded in here, D81, as classic's #lineup-panel; since 2026-11-13 in the classic look: .nl).
         The game tile, the one quiet line and the filter bar (sticky) are drawn by showdown/view.js; #sd-lineup-mount is the only part showdown/lineup.js
         redraws (the pool with #sd-table, #sd-thead, #sd-tbody and #sd-legend, the Optimizer panel, the lineup read and the swaps),
         so a redraw never replaces a filter box Adam is typing in. The tab row is in the shared top bar (#sd-tabs). -->
    <div id="sd-lineup-panel" class="panel nl sd-lineup-panel">
      <div id="sd-gameline"></div>
      <div id="sd-stamps" class="stamps-host"></div>
      <div id="sd-filterbar" class="fbar sd-filterbar"></div>
      <div id="sd-build-notice" class="build-notice" hidden></div>
      <div id="sd-lineup-mount" class="sd-lineup-mount"></div>
    </div>
    <!-- The Lineups tab (Adam 2026-11-05): full width, no player list; drawn by showdown/lineups-screen.js. -->
    <div id="sd-lineups-panel" class="panel sd-lineups-panel" hidden></div>
    <div id="sd-sources-panel" class="panel sources-panel" hidden></div>
    <div id="sd-projections-panel" class="panel" hidden></div>
    <div id="sd-ownership-panel" class="panel" hidden></div>
    <div id="sd-injuries-panel" class="panel" hidden></div>
    <div id="sd-entries-panel" class="panel" hidden></div>
    <div id="sd-empty-state" class="empty-state nl" hidden></div>
    <!-- The details of a board that could not be read (the foot of the page, never the main view); filled by showdown/view.js, hidden when empty. -->
    <p id="sd-foot-note" class="storage-foot nl" hidden></p>
  </main>

  <!-- The page's foot: a setting the browser could not read and reset to defaults (storage-damage.js); hidden when none. -->
  <footer id="storage-foot" class="storage-foot" hidden></footer>

  <script type="module" src="app.js"></script>
  <script>
    // Dev/QA convenience only: "?tab=lineup" (or any tab key) clicks that tab's button once it exists,
    // so a headless screenshot can land straight on a non-default tab without a separate DevTools
    // script. Polls briefly because the tab buttons only render after the board finishes loading.
    // "&scrollTo=<id>" (added for the Saved Lineups screenshot) additionally scrolls that element into
    // view once it exists, since the tab's own content can be taller than one screenshot's viewport.
    (function () {
      var params = new URLSearchParams(window.location.search);
      var wantTab = params.get("tab");
      var scrollToId = params.get("scrollTo");
      if (!wantTab && !scrollToId) return;
      var tabClicked = !wantTab;
      var attempts = 0;
      var timer = setInterval(function () {
        attempts++;
        if (!tabClicked) {
          // Showdown mode (D39/D40) has its own tab bar (#sd-tabs) alongside the classic one (#tabs),
          // both present in the DOM at once (the inactive mode's container is merely hidden) — scoping by
          // location.hash's "#sd=" prefix picks the one actually on screen instead of always matching
          // #tabs first in document order.
          var scope = window.location.hash.indexOf("#sd=") === 0 ? "#sd-tabs" : "#tabs";
          // "?tab=projections" and "?tab=ownership" are the Projections | Ownership switch of the Sources page now (Adam 2026-10-18):
          // the page is not drawn until the header's Sources button is clicked, so that button is clicked first (once), then the switch.
          // Each mode has its own page (#sources-panel on the classic page, #sd-sources-panel on a showdown), picked by scope.
          var onSources = wantTab === "projections" || wantTab === "ownership";
          var panel = scope === "#sd-tabs" ? "#sd-sources-panel" : "#sources-panel";
          var btn = onSources ? document.querySelector(panel + ' [data-tab="' + wantTab + '"]') : document.querySelector(scope + ' [data-tab="' + wantTab + '"]');
          // "?tab=injuries": the top bar's Injuries button (it sits beside Sources, outside the tab row), once the tab row is drawn.
          if (wantTab === "injuries") btn = document.querySelector(scope + " .tab-btn") ? document.getElementById(scope === "#sd-tabs" ? "sd-injuries-btn" : "injuries-btn") : null;
          // Clicked on every poll until the switch exists (opening the page twice changes nothing), since app.js may not have wired the button yet.
          if (onSources && !btn) {
            var link = document.getElementById(scope === "#sd-tabs" ? "sd-sources-btn" : "sources-btn");
            if (link) link.click();
          }
          if (btn) {
            btn.click();
            tabClicked = true;
          } else if (!onSources && document.querySelector(scope + " .tab-btn")) {
            // The tab bar is drawn but has no such tab: a retired key ("?tab=rankings", "?tab=favorites"; tabs.js RETIRED_TABS) or an
            // unknown one, which the page already shows as the Optimizer, so there is nothing to click and no reason to keep polling.
            tabClicked = true;
          }
        }
        // Waits for the saved-lineups list to finish its own async load (never scrolls while it still
        // reads "Loading…") and only then scrolls, once — scrolling earlier, while the panel above it is
        // still being sized off the current scroll position, was moving the target underneath itself.
        var scrolled = !scrollToId;
        if (tabClicked && scrollToId) {
          var el = document.getElementById(scrollToId);
          var ready = el && el.querySelector(".lc, .saved-lineups-empty");
          if (ready) {
            el.scrollIntoView({ block: "start" });
            scrolled = true;
          }
        }
        if (tabClicked && scrolled) {
          clearInterval(timer);
        } else if (attempts > 600) {
          clearInterval(timer); // ~60s at 100ms: give up rather than poll forever
        }
      }, 100);
    })();
  </script>
  <script type="module" src="site/site.js"></script>
</body>
</html>
